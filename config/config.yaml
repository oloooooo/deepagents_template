# 由 config/config.py 用 OmegaConf 加载，再用 pydantic 校验（extra="forbid"，写错键会直接报错）。
#
# 值一律写成 ${oc.env:变量名,默认值}：默认值留在这里，真值放项目根目录的 .env（已 gitignore）。
# 优先级：系统环境变量 > .env > 这里的默认值。
# 想再加一个能从外部改的键，照抄一行就行，不用动 config.py。
#
# 字符串默认值要加引号：YAML 会把 1234 解析成 int，pydantic 的 str 字段直接拒收
# （ValidationError: Input should be a valid string）。

postgresql:
  # deepagent 的 state（检查点）与 store（长期记忆）共用这一份连接参数
  # deepagent:
  #   host: ${oc.env:PG_DEEPAGENT_HOST,127.0.0.1}
  #   port: ${oc.env:PG_DEEPAGENT_PORT,5432}
  #   user: ${oc.env:PG_DEEPAGENT_USER,postgres}
  #   password: ${oc.env:PG_DEEPAGENT_PASSWORD,"1234"}
  #   db_name: ${oc.env:PG_DEEPAGENT_DB,deepagent}

  # 业务用户表：账号 / 邮箱 / 密码哈希 / refresh token。将来拆库只改这五行
  user:
    host: ${oc.env:PG_HOST,127.0.0.1}
    port: ${oc.env:PG_PORT,5432}
    user: ${oc.env:PG_USER,postgres}
    password: ${oc.env:PG_PASSWORD,"1234"}
    db_name: ${oc.env:PG_DB,user_related}

# deepagents 智能体：模型走 OpenAI 兼容端点，具体 key 从 api_key_env 指向的环境变量读取
deepagent:
  model: deepseek-flash
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0.0

logger:
  # 日志目录（相对项目根，也可写绝对路径）
  level: ${oc.env:LOG_LEVEL,INFO}
  dir: ${oc.env:LOG_DIR,logs}
  # 单文件切分条件 / 历史保留时长，loguru 语法。按环境改的少，直接写死
  rotation: "10 MB"
  retention: "7 days"
  backtrace: true
  # 打印异常时附带变量值，生产建议关闭
  diagnose: false

auth:
  # 生产环境务必在 .env 里设 AUTH_SECRET_KEY；HMAC-SHA256 要求至少 32 字节
  secret_key: ${oc.env:AUTH_SECRET_KEY,"dev-only-secret-key-change-me-before-prod"}
  algorithm: HS256
  # token 有效期属于策略而不是环境，写死；确实要按环境改就照上面的写法加 ${oc.env:...}
  # access token 有效期：30 分钟
  access_token_expire_minutes: 30
  # refresh token 有效期：7 天
  refresh_token_expire_days: 7
